<!doctype html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Hades</title>
    <style>
        /* Nevtieravý pás pri strate spojenia. Značkové tokeny (docs/BRAND-HADES.md §3),
           žiadny raw hex mimo :root / [data-theme]. */
        :root {
            --panel: #16201e;
            --fg: #e7ebe9;
            --fg-dim: #9aa6a2;
            --accent: #c4a2f5;
            --border: rgba(196, 162, 245, .30);
        }

        :root[data-theme="light"] {
            --panel: #ffffff;
            --fg: #17201e;
            --fg-dim: #5b6763;
            --accent: #6d3fb5;
            --border: #c9b0ee;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--accent);
        }

        /* Bodka je v základnom stave PLNÁ — tichá verzia je teda pokojný plný bod
           vedľa textu stavu, nie zamrznutá poloprehľadná bodka. Tento dokument
           nenačítava mind.css, takže plošná podlaha `prefers-reduced-motion` ho
           nekryje a gate `no-preference` je jediný nositeľ tichej verzie. */
        @media (prefers-reduced-motion: no-preference) {
            /* Slučková krivka, nie `ease-in-out` (manuál §3): príchodová krivka na
               nekonečnej slučke kulhá — spomalí a skočí. Hodnota `--ease-pulse`
               z mind.css, doslova, lebo tokeny sem nedosiahnu. Perióda 1,4 s je
               `--dur-pulse` — perióda neurčitého čakania. */
            .dot { animation: blink 1.4s cubic-bezier(.4, 0, .6, 1) infinite; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }

        /* Pás je jeden riadok vysoký 30 px: dlhší text (režim „run") sa musí zmestiť
           na jednu linku a v úzkom okne sa radšej skrátiť, než pretlačiť pás von. */
        .text {
            min-width: 0;
            margin: 0;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .text b { font-weight: 600; }
        .text span { color: var(--fg-dim); }

        /* ── Plošná podlaha pohybu (tichá verzia) ────────────────────────────────
           Kópia podlahy z public/css/mind.css. Tento dokument mind.css nenačítava,
           takže podlaha odtiaľ ho nekryje. Pás dnes nemá ani jeden `transition`,
           takže podlaha nemení NIČ merateľné (`.dot` má tichú verziu z gate
           `no-preference` vyššie a ten je silnejší — animácia sa vôbec nenasadí).
           Je tu preto, aby prvý `transition`, ktorý sem niekto dopíše, mal tichú
           verziu od prvého dňa; presne tak sa `.retry` v offline.html dostal do
           stavu, kde pohyb bežal aj pri vypnutom pohybe. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0s !important;
                transition-duration: .01ms !important;
                transition-delay: 0s !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <span class="dot" aria-hidden="true"></span>
    <p class="text" role="status" aria-live="polite">
        <b id="head">Stratené spojenie</b> <span id="tail">— skúšam sa pripojiť znova…</span>
    </p>

    <script>
        (function () {
            'use strict';

            var api = window.hadesState;
            var root = document.documentElement;
            var head = document.getElementById('head');
            var tail = document.getElementById('tail');

            /*
             * Dva režimy, dva texty (main proces posiela ktorý; stránka nič nerozhoduje):
             *
             *   ws  — zmizol Reverb listener. Živé prírastky nechodia, appka funguje.
             *   run — POST behu zomrel na sieti. Rozpísaná odpoveď sa NEDOKONČÍ:
             *         prúd NDJSON bol telom toho requestu a obnova beží len z
             *         /api/console/decide, nikdy z prekreslenia okna. Preto pás
             *         hovorí aj to, čo zostáva — front rozpísaných správ v okne —
             *         a že sa okno samo neobnoví, aby ho nezahodilo.
             */
            var TEXT = {
                ws: {
                    head: 'Stratené spojenie',
                    tail: '— skúšam sa pripojiť znova…'
                },
                run: {
                    head: 'Beh sa prerušil',
                    tail: '— rozpísaná odpoveď sa nedokončí. Okno sa samo neobnoví, '
                        + 'aby ti neodišli rozpísané správy.'
                }
            };

            if (api) {
                api.onTheme(function (theme) {
                    root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                });

                api.onBanner(function (info) {
                    var text = TEXT[info && info.mode === 'run' ? 'run' : 'ws'];

                    head.textContent = text.head;
                    tail.textContent = text.tail;
                });

                api.ready();
            }
        })();
    </script>
</body>
</html>
