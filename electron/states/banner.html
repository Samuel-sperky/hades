<!doctype html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Hades</title>
    <style>
        /* Nevtieravý pás pri strate spojenia. Značkové tokeny (docs/BRAND-HADES.md §3),
           žiadny raw hex mimo :root / [data-theme]. */
        :root {
            --panel: #16201e;
            --fg: #e7ebe9;
            --fg-dim: #9aa6a2;
            --accent: #c4a2f5;
            --border: rgba(196, 162, 245, .30);
        }

        :root[data-theme="light"] {
            --panel: #ffffff;
            --fg: #17201e;
            --fg-dim: #5b6763;
            --accent: #6d3fb5;
            --border: #c9b0ee;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--accent);
        }

        @media (prefers-reduced-motion: no-preference) {
            .dot { animation: blink 1.4s ease-in-out infinite; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }

        /* Pás je jeden riadok vysoký 30 px: dlhší text (režim „run") sa musí zmestiť
           na jednu linku a v úzkom okne sa radšej skrátiť, než pretlačiť pás von. */
        .text {
            min-width: 0;
            margin: 0;
            color: var(--fg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .text b { font-weight: 600; }
        .text span { color: var(--fg-dim); }
    </style>
</head>
<body>
    <span class="dot" aria-hidden="true"></span>
    <p class="text" role="status" aria-live="polite">
        <b id="head">Stratené spojenie</b> <span id="tail">— skúšam sa pripojiť znova…</span>
    </p>

    <script>
        (function () {
            'use strict';

            var api = window.hadesState;
            var root = document.documentElement;
            var head = document.getElementById('head');
            var tail = document.getElementById('tail');

            /*
             * Dva režimy, dva texty (main proces posiela ktorý; stránka nič nerozhoduje):
             *
             *   ws  — zmizol Reverb listener. Živé prírastky nechodia, appka funguje.
             *   run — POST behu zomrel na sieti. Rozpísaná odpoveď sa NEDOKONČÍ:
             *         prúd NDJSON bol telom toho requestu a obnova beží len z
             *         /api/console/decide, nikdy z prekreslenia okna. Preto pás
             *         hovorí aj to, čo zostáva — front rozpísaných správ v okne —
             *         a že sa okno samo neobnoví, aby ho nezahodilo.
             */
            var TEXT = {
                ws: {
                    head: 'Stratené spojenie',
                    tail: '— skúšam sa pripojiť znova…'
                },
                run: {
                    head: 'Beh sa prerušil',
                    tail: '— rozpísaná odpoveď sa nedokončí. Okno sa samo neobnoví, '
                        + 'aby ti neodišli rozpísané správy.'
                }
            };

            if (api) {
                api.onTheme(function (theme) {
                    root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                });

                api.onBanner(function (info) {
                    var text = TEXT[info && info.mode === 'run' ? 'run' : 'ws'];

                    head.textContent = text.head;
                    tail.textContent = text.tail;
                });

                api.ready();
            }
        })();
    </script>
</body>
</html>
