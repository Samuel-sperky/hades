<!doctype html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:;">
    <title>Hades — Vedomie</title>
    <style>
        /* ── Značkové tokeny (docs/BRAND-HADES.md §3). Tmavá je default, svetlá je
           povinná varianta. Žiadny raw hex mimo tohto :root / [data-theme]. ────── */
        :root {
            --paper: #0e1413;
            --panel: #16201e;
            --fg: #e7ebe9;
            --fg-dim: #9aa6a2;
            --accent: #c4a2f5;
            --accent-hover: #d9c6fa;
            --on-accent: #0e1413;
            --gold: #d8b878;
            --border: rgba(196, 162, 245, .30);
            --code-bg: #0a0f0e;
            --code-fg: #d0d7d4;
        }

        :root[data-theme="light"] {
            --paper: #f6f4f1;
            --panel: #ffffff;
            --fg: #17201e;
            --fg-dim: #5b6763;
            --accent: #6d3fb5;
            --accent-hover: #58309a;
            --on-accent: #ffffff;
            --gold: #8a6417;
            --border: #c9b0ee;
            --code-bg: #efe9f6;
            --code-fg: #2a2140;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            padding: 32px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .sigil {
            width: 84px;
            height: 84px;
            margin: 0 auto 28px;
            display: block;
        }

        /* ZNAK-STYLE: generuje tools/brand/build-mark.py zo hades-sigil-mini.svg.
           Needituj ručne — pri najbližšom behu generátora sa zmena stratí.
           Dôvod, prečo je geometria aj tu: tento dokument sa zobrazuje, KEĎ SERVER
           NEBEŽÍ, takže nemôže načítať mind.css ani nič z public/.
           ZNAK JE SIEŤ (1. 9. 2026): prstenec (`.ring`) je retirovaný — v sieti nie je
           zavretá krivka, ktorú by pomenoval. Uzly sú tu PLNÉ DISKY, nie prstence:
           pri 84 px by obrys uzla mal 1.13 px, teda pod podlahou 1.5 px. */
        .sigil .edge { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; opacity: .8; }
        .sigil .edge--lat { opacity: .5; }
        .sigil .node { fill: var(--accent); }
        .sigil .core { fill: var(--gold); transform-origin: 50px 50px; }
        /* /ZNAK-STYLE */

        /* ── POHYB ZNAKU. Stojí ZÁMERNE MIMO markerov ZNAK-STYLE: generátor vlastní
           geometriu, nie dramaturgiu, a keby bola vnútri, prvý beh generátora by
           ju zmazal.

           Poradie zrodu je poradie, v akom sieť čítame — to isté, čo `.bc-mark`
           v mind.css, len s lokálnymi menami (mind.css sem nedosiahne):
             uzly 0 / 80 / 160 ms → hrany 200 ms → jadro sa presýti na 1200 ms.

           `transform-box: fill-box` MUSÍ byť na UZLOCH. V SVG je počiatočná hodnota
           `view-box` a `transform-origin` `0 0`, takže `scale()` na kruhu bez tejto
           dvojice škáluje okolo rohu viewBoxu a uzol prilieta z ľava-hora namiesto
           toho, aby vyrástol na mieste. Uzly majú tri rôzne stredy, takže konštantu
           by CSS muselo poznať trikrát — `fill-box` + `center` to vyrieši bez `cx`/`cy`.

           JADRO TU NIE JE a je to zámer, nie opomenutie: jadro stojí v strede, takže
           mu počiatok dáva generátor priamo v ZNAK-STYLE (`transform-origin: 50px
           50px`, view-box súradnice). Napísať mu tu druhú dvojicu by znamenalo mať tú
           istú pravdu na dvoch miestach — a to je presne to, čo sa pri prvej zmene
           geometrie rozíde.

           `pathLength="100"` na každej hrane je v markupe nižšie: hrany majú rôznu
           dĺžku (36,00 / 39,50 / 41,00 / 56,60 jednotky — prvé tri sú `NET_SATS`
           vzdialenosti, lebo hrana ide od stredu jadra do stredu uzla), takže bez neho
           by jedna konštanta `stroke-dasharray` dokreslila jednu hranu a ostatné
           zastavila v polovici. */
        .sigil .node {
            transform-box: fill-box;
            transform-origin: center;
        }

        /* Základný stav je HOTOVÝ ZNAK: plná mierka, plná farba, hrany nakreslené.
           Tichá verzia (`prefers-reduced-motion: reduce`) tým nie je „vypnuté", ale
           dosadnutý znak — nikdy nezamrzne v spodnej fáze dýchania ani na polovične
           dokreslenej hrane. Plošná podlaha z mind.css tento dokument nekryje
           (nenačítava ho), preto je táto dvojica jediný nositeľ tichej verzie
           a musí zostať. */
        .sigil .node,
        .sigil .core { transform: scale(1); opacity: 1; }
        .sigil .edge { stroke-dashoffset: 0; }

        @media (prefers-reduced-motion: no-preference) {
            .sigil .edge {
                stroke-dasharray: 100;
                stroke-dashoffset: 100;
                animation: sig-draw 760ms cubic-bezier(.22, 1, .36, 1) 200ms 1 both;
            }
            .sigil .node { animation: sig-node-in 220ms cubic-bezier(.22, 1, .36, 1) 1 both; }
            .sigil .nodes .node:nth-child(2) { animation-delay: 80ms; }
            .sigil .nodes .node:nth-child(3) { animation-delay: 160ms; }
            /* Jadro nesie DVE animácie v JEDNOM zápise a poradie je nosné: zrod
               (jedna dlhá dráha s plató v strede — zjaví sa ako bledý uzol, počká na
               hrany, potom sa presýti) a až po ňom dýchanie. `core-pulse` stojí
               v zozname DRUHÉ, takže po 1200 ms prebíja dosadnutie zrodu, a kým beží
               jeho oneskorenie, nevypĺňa nič (nemá `both`) a zrod má voľné pole.
               Dve samostatné pravidlá by sa o `transform` bili a druhé by so `both`
               počas oneskorenia prepísalo dosadnutie prvého.
               Slučková krivka, nie `ease-in-out`: príchodová krivka na nekonečnej
               slučke kulhá — spomalí a skočí. Rovnaká hodnota ako `--ease-pulse`
               v mind.css; tu je napísaná doslova, lebo tokeny sem nedosiahnu. */
            .sigil .core {
                animation:
                    sig-core-in 1040ms cubic-bezier(.22, 1, .36, 1) 160ms 1 both,
                    core-pulse 4s cubic-bezier(.4, 0, .6, 1) 1200ms infinite;
            }
        }

        @keyframes sig-draw {
            from { stroke-dashoffset: 100; }
            to   { stroke-dashoffset: 0; }
        }

        @keyframes sig-node-in {
            from { opacity: 0; transform: scale(.4); }
            70%  { opacity: 1; transform: scale(1.12); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* `filter: saturate()` a nie výmena farby: zlatá je v markupe (`var(--gold)`)
           a CSS ju nesmie duplikovať. `saturate(.08)` z nej urobí svetlú šedú
           v ľubovoľnej téme — teda uzol, ktorý ešte nie je jadrom. */
        @keyframes sig-core-in {
            0%   { opacity: 0; transform: scale(.4);  filter: saturate(.08); }
            21%  { opacity: 1; transform: scale(1);   filter: saturate(.08); }
            62%  { opacity: 1; transform: scale(1);   filter: saturate(.08); }
            84%  { opacity: 1; transform: scale(1.16); filter: saturate(1); }
            to   { opacity: 1; transform: scale(1);   filter: saturate(1); }
        }

        @keyframes core-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(.9); opacity: .78; }
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.25;
            margin: 0 0 10px;
            letter-spacing: -.01em;
        }

        .lede {
            font-size: 15px;
            line-height: 1.5;
            color: var(--fg-dim);
            margin: 0 0 24px;
        }

        .step {
            text-align: left;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            margin: 0 0 24px;
        }

        .step-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--fg-dim);
            margin: 0 0 8px;
        }

        code {
            display: block;
            font-family: "Geist Mono", ui-monospace, "Cascadia Code", "Consolas", monospace;
            font-size: 14px;
            background: var(--code-bg);
            color: var(--code-fg);
            border-radius: 8px;
            padding: 10px 12px;
            user-select: text;
            overflow-x: auto;
        }

        .retry {
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--on-accent);
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            padding: 11px 22px;
            cursor: pointer;
            /* Rebrík §3: hover / farba / malý stav = `--dur-fast` (150 ms) a krivka
               príchodu `--ease`. Doslovné hodnoty, lebo tokeny sem nedosiahnu —
               ten istý dôvod ako pri krivke pulzu vyššie. Do 31. 8. 2026 tu stálo
               `.15s ease`: správne trvanie, ale ryzé `ease` je jedna z cudzích
               kriviek, ktoré §3 menuje (a manuál presne tento zápis uvádza ako
               nález na `charon.css:257`). */
            transition: background 150ms cubic-bezier(.22, .61, .36, 1);
        }

        .retry:hover { background: var(--accent-hover); }
        .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .retry[disabled] { opacity: .6; cursor: default; }

        /* Druhá voľba po prerušenom behu: „Načítať znovu" zahadzuje rozpísané, takže
           nesmie vyzerať ako hlavná akcia — tichšia varianta toho istého tlačidla. */
        .retry.ghost {
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .retry.ghost:hover { background: var(--panel); }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .hidden { display: none; }

        .status {
            min-height: 20px;
            margin: 16px 0 0;
            font-size: 13px;
            color: var(--fg-dim);
        }

        /* ── Plošná podlaha pohybu (tichá verzia) ────────────────────────────────
           Tá istá podlaha, akú nesie public/css/mind.css — musí byť skopírovaná
           TU, pretože tento dokument sa zobrazuje, KEĎ SERVER NEBEŽÍ, takže žiadny
           stylesheet z public/ sa nenačíta a podlaha odtiaľ sem nedosiahne.
           Bez nej nemal `.retry` tichú verziu vôbec (zmerané: transition-duration
           0,15 s v OBOCH režimoch prefers-reduced-motion).

           Trvanie padá na .01 ms, nie na `none`: prechod farby pozadia pri hoveri
           má byť OKAMŽITÝ EKVIVALENT — farba sa stále zmení, len bez cesty — a
           `transitionend` naďalej príde.

           Gate `no-preference` nad `core-pulse` vyššie zostáva a nie je to
           duplikát: podlaha rieši trvanie, gate nesie ZÁKLADNÝ STAV, teda že
           tichá verzia jadra je hotový znak (scale 1, opacity 1), nie fáza cyklu,
           v ktorej ho podlaha zastihla. Nová animácia v tomto dokumente potrebuje
           oboje. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0s !important;
                transition-duration: .01ms !important;
                transition-delay: 0s !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <!-- ZNAK: generuje tools/brand/build-mark.py — needituj ručne.
             SIEŤ v DISKOVOM stupni (`.sigil` je 84 px). Súradnice sú kánon
             z hades-sigil-mini.svg + NET_* konštánt generátora, nie ručná kresba.
             Hrany idú od stredu k stredu a konce im zakryjú disky — žiadne pahýle.
             `.nodes` musí obsahovať PRESNE tri uzly: zrod ide cez :nth-child(2)/(3). -->
        <svg class="sigil" viewBox="0 0 100 100" aria-hidden="true">
            <path class="edge" pathLength="100" d="M 50 50 L 63.49 16.62"></path>
            <path class="edge" pathLength="100" d="M 50 50 L 11.85 39.78"></path>
            <path class="edge" pathLength="100" d="M 50 50 L 71.73 84.77"></path>
            <path class="edge edge--lat" pathLength="100" d="M 63.49 16.62 L 11.85 39.78"></path>
            <g class="nodes">
                <circle class="node" cx="63.49" cy="16.62" r="8.91"></circle>
                <circle class="node" cx="11.85" cy="39.78" r="7.29"></circle>
                <circle class="node" cx="71.73" cy="84.77" r="6.07"></circle>
            </g>
            <circle class="core" cx="50" cy="50" r="13.68"></circle>
        </svg>
        <!-- /ZNAK -->

        <h1 id="head">Vedomie sa nepodarilo prebudiť</h1>
        <p class="lede" id="lede">Server neodpovedá — skontroluj, či Hades beží.</p>

        <div class="step">
            <p class="step-label">Spusti v koreni projektu</p>
            <code>docker compose up -d</code>
        </div>

        <div class="actions">
            <button class="retry" id="retry" type="button">Skúsiť znova</button>
            <button class="retry hidden" id="resume" type="button">Pokračovať v okne</button>
            <button class="retry ghost hidden" id="reload" type="button">Načítať znovu</button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        (function () {
            'use strict';

            var api = window.hadesState;
            var root = document.documentElement;
            var btn = document.getElementById('retry');
            var resumeBtn = document.getElementById('resume');
            var reloadBtn = document.getElementById('reload');
            var head = document.getElementById('head');
            var lede = document.getElementById('lede');
            var status = document.getElementById('status');
            var countdown = null;

            /*
             * Dva režimy tej istej obrazovky (main proces posiela, ktorý platí):
             *
             *   load — appka sa nenačítala. Niet čo stratiť, takže sa zotavuje sama:
             *          keď backend nabehne, okno sa načíta a obrazovka zmizne.
             *   run  — backend spadol POČAS behu. Stránka je načítaná a drží veci,
             *          ktoré v DB nie sú (rozpísaná správa, front správ). Preto sa
             *          tu nič nenačíta samo a po návrate servera rozhoduje človek:
             *          „Pokračovať v okne" (nechať tak) alebo „Načítať znovu"
             *          (zahodiť rozpísané a poskladať vlákno z DB).
             */
            var TEXT = {
                load: {
                    head: 'Vedomie sa nepodarilo prebudiť',
                    lede: 'Server neodpovedá — skontroluj, či Hades beží.'
                },
                run: {
                    head: 'Spojenie spadlo počas behu',
                    lede: 'Rozpísaná odpoveď sa nedokončí — uložené je to, čo server stihol. '
                        + 'Okno nechávam tak, ako je, aby ti neodišli rozpísané správy.'
                }
            };

            function stopCountdown() {
                if (countdown !== null) {
                    clearInterval(countdown);
                    countdown = null;
                }
            }

            function show(el, visible) {
                el.classList.toggle('hidden', !visible);
            }

            function render(st) {
                stopCountdown();

                var mode = st && st.mode === 'run' ? 'run' : 'load';
                var phase = st && st.phase ? st.phase : 'connecting';
                var text = TEXT[mode];

                head.textContent = text.head;
                lede.textContent = text.lede;

                // 'ready' nastáva len v režime 'run': backend je späť a čaká sa na
                // rozhodnutie človeka, nie na ďalší automatický pokus.
                var decide = phase === 'ready';

                show(btn, !decide);
                show(resumeBtn, decide);
                show(reloadBtn, decide);

                if (decide) {
                    status.textContent = 'Hades je späť. „Načítať znovu" zahodí rozpísané správy.';

                    return;
                }

                if (phase === 'connecting') {
                    btn.disabled = true;
                    status.textContent = 'Pripájam sa…';

                    return;
                }

                // 'waiting' — odpočet do ďalšieho automatického pokusu.
                btn.disabled = false;

                var tick = function () {
                    var left = Math.max(0, Math.round((st.nextAt - Date.now()) / 1000));
                    status.textContent = left > 0
                        ? 'Ďalší pokus o ' + left + ' s'
                        : 'Pripájam sa…';
                };

                tick();
                countdown = setInterval(tick, 500);
            }

            if (api) {
                api.onTheme(function (theme) {
                    root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                });

                api.onStatus(render);

                btn.addEventListener('click', function () {
                    stopCountdown();
                    btn.disabled = true;
                    status.textContent = 'Pripájam sa…';
                    api.retry();
                });

                resumeBtn.addEventListener('click', function () {
                    stopCountdown();
                    api.resume();
                });

                reloadBtn.addEventListener('click', function () {
                    stopCountdown();
                    status.textContent = 'Načítavam…';
                    api.reload();
                });

                api.ready();
            }
        })();
    </script>
</body>
</html>
