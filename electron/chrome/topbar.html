<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'">
<title>Hades — lišta</title>
<style>
  /*
   * Farby sú HODNOTY zo značky (docs/BRAND-HADES.md §3): amethyst je interaktívny,
   * zlato je značkové (jadro znaku). Lišta je Electron chróm, nie stránka appky —
   * preto tu žijú vlastné tokeny; s public/css/* zámerne nezdieľame súbor.
   * Svetlá téma je v :root, tmavú prepíname [data-theme="dark"] (nastaví JS z IPC)
   * aj @media (prefers-color-scheme: dark) — kým nedôjde prvá téma z appky.
   */
  :root {
    --bar-bg: #f4f2ee;          /* papier (svetlá) */
    --bar-text: #0e1413;        /* atrament */
    --bar-muted: rgba(14, 20, 19, .60);
    --bar-border: rgba(14, 20, 19, .12);
    --bar-hover: rgba(14, 20, 19, .07);
    --accent: #6d3fb5;          /* amethyst (svetlá) */
    --accent-soft: rgba(109, 63, 181, .13);
    --gold: #b88a3a;            /* jadro znaku (svetlá) */
    --focus: #6d3fb5;
    --close-hover: #d64541;
    --close-ink: #ffffff;
  }
  :root[data-theme="dark"] {
    --bar-bg: #0e1413;
    --bar-text: #e7eae9;
    --bar-muted: rgba(231, 234, 233, .60);
    --bar-border: rgba(231, 234, 233, .12);
    --bar-hover: rgba(231, 234, 233, .09);
    --accent: #c4a2f5;
    --accent-soft: rgba(196, 162, 245, .16);
    --gold: #d8b878;
    --focus: #c4a2f5;
    --close-hover: #d64541;
    --close-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bar-bg: #0e1413;
      --bar-text: #e7eae9;
      --bar-muted: rgba(231, 234, 233, .60);
      --bar-border: rgba(231, 234, 233, .12);
      --bar-hover: rgba(231, 234, 233, .09);
      --accent: #c4a2f5;
      --accent-soft: rgba(196, 162, 245, .16);
      --gold: #d8b878;
      --focus: #c4a2f5;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bar-bg);
    color: var(--bar-text);
    font: 13px/1.2 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Celá lišta je ťahacia; interaktívne prvky si ťahanie vypnú. */
  .bar {
    display: flex;
    align-items: center;
    height: 40px;
    padding-left: 10px;
    border-bottom: 1px solid var(--bar-border);
    -webkit-app-region: drag;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 6px;
    min-width: 0;
  }
  .brand .sigil { width: 16px; height: 16px; flex: none; }
  .brand .title {
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group { display: flex; align-items: center; gap: 2px; }
  .group.nav { margin-left: 6px; }
  .group.screens { margin-left: 6px; }
  .sep {
    width: 1px;
    height: 18px;
    margin: 0 6px;
    background: var(--bar-border);
    -webkit-app-region: drag;
  }

  .spacer { flex: 1 1 auto; align-self: stretch; -webkit-app-region: drag; }

  button {
    -webkit-app-region: no-drag;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 28px;
    min-width: 34px;
    padding: 0 8px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--bar-text);
    font: inherit;
    cursor: pointer;
    transition: background-color .12s ease, color .12s ease, opacity .12s ease;
  }
  button .ic { width: 16px; height: 16px; flex: none; }
  button:hover { background: var(--bar-hover); }
  button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
  }
  button:disabled { opacity: .34; cursor: default; }
  button:disabled:hover { background: transparent; }

  /* Aktívna obrazovka: amethyst je nosič aktívneho stavu (kánon akcentu). */
  .screens button.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  /* Systémové okenné tlačidlá: štvorcové, bez labelu; zavrieť má červený hover. */
  .group.win { margin-left: 2px; }
  .group.win button {
    min-width: 40px;
    height: 40px;
    border-radius: 0;
    color: var(--bar-muted);
  }
  .group.win button:hover { color: var(--bar-text); }
  #win-close:hover { background: var(--close-hover); color: var(--close-ink); }

  svg { display: block; }
  .ic line, .ic polyline, .ic rect, .ic path { stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ic--win line, .ic--win rect, .ic--win polyline { stroke-width: 1.3; }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand" title="Hades — Hierarchical Associative Data Embedding System">
      <svg class="sigil" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="36" fill="none" stroke="var(--accent)" stroke-width="9"></circle>
        <circle cx="50" cy="50" r="15" fill="var(--gold)"></circle>
      </svg>
      <span class="title" id="title">Hades</span>
    </div>

    <div class="group nav">
      <button id="nav-back" type="button" title="Späť" aria-label="Späť">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="14,6 8,12 14,18"></polyline></svg>
      </button>
      <button id="nav-forward" type="button" title="Vpred" aria-label="Vpred">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="10,6 16,12 10,18"></polyline></svg>
      </button>
    </div>

    <div class="sep" aria-hidden="true"></div>

    <div class="group screens" role="group" aria-label="Obrazovky">
      <button id="scr-graf" type="button" title="Graf vedomia" aria-label="Graf">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6" cy="7" r="2"></circle><circle cx="18" cy="6" r="2"></circle>
          <circle cx="12" cy="16" r="2.4"></circle>
          <line x1="7.6" y1="8.2" x2="10.6" y2="14.2"></line>
          <line x1="16.6" y1="7.4" x2="13.3" y2="14.4"></line>
        </svg>
        <span>Graf</span>
      </button>
      <!-- Chat (`/chat`) je plnohodnotná appka, Charón (`/console`) zostáva technická
           konzola (kontrakt C-1: URL sa neláme). Ikony to musia rozlíšiť, inak sú to
           dve bubliny: chat má bublinu s riadkami, konzola šípku s podčiarkovníkom. -->
      <button id="scr-chat" type="button" title="Chat s vedomím" aria-label="Chat">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a7 6 0 0 1-7 6H8l-4 3 1-4.5A6 6 0 0 1 4 12a7 6 0 0 1 16 0Z"></path>
          <line x1="8.5" y1="10.5" x2="15.5" y2="10.5"></line>
          <line x1="8.5" y1="13.5" x2="13" y2="13.5"></line>
        </svg>
        <span>Chat</span>
      </button>
      <button id="scr-charon" type="button" title="Charón — technická konzola" aria-label="Charón">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="6,8 9.5,12 6,16"></polyline>
          <line x1="12" y1="16" x2="18" y2="16"></line>
        </svg>
        <span>Charón</span>
      </button>
    </div>

    <div class="spacer" aria-hidden="true"></div>

    <div class="group win">
      <button id="win-min" type="button" title="Minimalizovať" aria-label="Minimalizovať">
        <svg class="ic ic--win" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"></line></svg>
      </button>
      <button id="win-max" type="button" title="Maximalizovať" aria-label="Maximalizovať">
        <svg class="ic ic--win" id="win-max-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>
      </button>
      <button id="win-close" type="button" title="Zavrieť" aria-label="Zavrieť">
        <svg class="ic ic--win" viewBox="0 0 24 24" aria-hidden="true"><line x1="7" y1="7" x2="17" y2="17"></line><line x1="17" y1="7" x2="7" y2="17"></line></svg>
      </button>
    </div>
  </div>

  <script>
    'use strict';
    const bridge = window.hadesChrome;

    const el = (id) => document.getElementById(id);
    const back = el('nav-back');
    const forward = el('nav-forward');
    const grafBtn = el('scr-graf');
    const chatBtn = el('scr-chat');
    const charonBtn = el('scr-charon');
    const maxIcon = el('win-max-icon');
    const maxBtn = el('win-max');

    // Ikona maximalizovať vs. obnoviť (dva prekryté štvorce).
    const ICON_MAX = '<rect x="6" y="6" width="12" height="12" rx="1"></rect>';
    const ICON_RESTORE = '<rect x="8" y="8" width="10" height="10" rx="1"></rect><polyline points="8,8 8,5 18,5 18,15 15,15"></polyline>';

    back.addEventListener('click', () => bridge.nav('back'));
    forward.addEventListener('click', () => bridge.nav('forward'));
    grafBtn.addEventListener('click', () => bridge.screen('graf'));
    chatBtn.addEventListener('click', () => bridge.screen('chat'));
    charonBtn.addEventListener('click', () => bridge.screen('charon'));
    el('win-min').addEventListener('click', () => bridge.window('minimize'));
    maxBtn.addEventListener('click', () => bridge.window('maximize'));
    el('win-close').addEventListener('click', () => bridge.window('close'));

    bridge.onState((s) => {
      el('title').textContent = s.title || 'Hades';
      back.disabled = !s.canGoBack;
      forward.disabled = !s.canGoForward;

      // Jedna pravda o aktívnej obrazovke: trieda aj aria-pressed z tej istej zhody.
      [[grafBtn, 'graf'], [chatBtn, 'chat'], [charonBtn, 'charon']].forEach(([btn, name]) => {
        const on = s.screen === name;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', String(on));
      });

      maxIcon.innerHTML = s.maximized ? ICON_RESTORE : ICON_MAX;
      maxBtn.title = s.maximized ? 'Obnoviť' : 'Maximalizovať';
      maxBtn.setAttribute('aria-label', maxBtn.title);
    });

    bridge.onTheme((theme) => {
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    });

    bridge.ready();
  </script>
</body>
</html>
