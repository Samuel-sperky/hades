name: auraai

# Compose project name určuje názvy volumes (auraai_dbdata), kontajnerov a siete.
# Pri forku z Hadesa sa dáta NEPREBERAJÚ automaticky — starý hades_dbdata zostáva
# nedotknutý a obsah sa prenáša cez mysqldump → import (rozhodnutie #2 a #12).
# Postup je zdokumentovaný v refactor-auraai/07-W0-SPEC.md.

x-app: &app
  build: docker/php
  restart: always
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    # node_modules žije VO VOLUME kontajnera, nie na hostiteľovi. Vite 8 stojí na
    # rolldown, ktorý má natívnu binárku per platforma: `npm install` spustený vo
    # Windows dotiahne len @rolldown/binding-win32-x64-msvc a `npm run build`
    # v Linux kontajneri padne na "Cannot find module '../rolldown-binding.linux-x64-gnu.node'".
    # Volume oddelí obe inštalácie — host aj kontajner si držia svoje binárky
    # z toho istého package-lock.json. Po `docker compose down -v` treba znovu
    # `docker compose exec app npm ci`.
    - nodemodules:/var/www/html/node_modules
    - "${CC_TRANSCRIPTS:-C:/Users/Ucet/.claude/projects}:/transcripts:ro"
    # Zapisovateľný mount pre export vedomia späť do Claude memory.
    # Cesta je Claude Code konvencia: názov projektového adresára s / a : nahradenými -.
    # Po forku do C:\Aura\aura-ai je to C--Aura-aura-ai (predtým C--Users-Ucet-Desktop-AI-mind).
    - "${CC_MEMORY:-C:/Users/Ucet/.claude/projects/C--Aura-aura-ai/memory}:/memory-rw"
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      # 8082 počas sprintu: Hades ešte beží na 8080 ako živá záloha, kým AuraAI
      # nepreukáže funkčnosť. Prepnutie na finálny port je posledný krok sprintu.
      - "127.0.0.1:8082:8080"
    environment:
      PHP_CLI_SERVER_WORKERS: 8
      # Playwright prehliadače do node_modules volume, nie do vrstvy kontajnera.
      # Default /root/.cache/ms-playwright žije v kontajneri, takže každý rebuild
      # alebo --force-recreate ich zmaže a e2e brána spadne z dôvodu, ktorý nemá
      # nič spoločné s kódom. Inštalácia: docker compose exec -T app npx playwright
      # install --with-deps chromium
      PLAYWRIGHT_BROWSERS_PATH: /var/www/html/node_modules/.pw-browsers
    command: php artisan serve --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    ports:
      - "127.0.0.1:8083:8081"
    command: php artisan reverb:start --host=0.0.0.0 --port=8081

  # Reverzný proxy pre verejný (ngrok) prístup — appka + WebSocket na jednom porte,
  # chránené basic-auth. Lokálny priamy port ostáva bez proxy a bez hesla.
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "127.0.0.1:8084:8095"
    environment:
      # Token pre /mcp bol predtým plaintextom priamo v Caddyfile (git-trackovaný).
      # Presunutý do .env; starý token treba považovať za kompromitovaný.
      MCP_QUERY_TOKEN: "${MCP_QUERY_TOKEN:-}"
    # Bcrypt hash tunelového basic-auth hesla (rotovaný 4. 8. 2026, predtým sedel
    # v git-trackovanom Caddyfile). Vlastný env súbor je nutnosť, nie štýl:
    # hodnoty z `.env` compose interpoluje, takže `$2a$14$…` sa rozpadne na
    # neexistujúce premenné a Caddy dostane prázdny hash. env_file ide surový.
    env_file:
      - docker/caddy.env
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - reverb

  # Verejný prístup cez Cloudflare Tunnel. Konektor beží v sieti projektu a mieri
  # na `http://caddy:8095`, nie na localhost — appka tak zostáva za basic-auth
  # Caddy a WebSocket ide tým istým tunelom ako HTTP (rovnaký dôvod ako pri
  # ngroku, viď Caddyfile).
  #
  # QUICK TUNNEL (`--url`): URL je náhodná `*.trycloudflare.com`, mení sa pri
  # každom restarte kontajnera a číta sa z `docker logs auraai-cloudflared-1`.
  # Nepotrebuje token ani doménu.
  #
  # POJMENOVANÝ TUNEL (stabilná URL): vyžaduje zónu na Cloudflare nameserveroch
  # a public hostname v Zero Trust dashboarde nastavený na službu
  # `http://caddy:8095`. Prepnutie = `command: tunnel --no-autoupdate run` +
  # `TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"` v environment. Token pre pojmenovaný
  # tunel rodiny žije v `C:\Aura\aura-gateway\.env`, nie tu — jedna URL vie
  # obsluhovať len jeden origin a rodina má ísť cez gateway.
  #
  # Zapnutie: docker compose --profile tunnel up -d cloudflared
  # Vypnutie: docker compose --profile tunnel stop cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://caddy:8095
    depends_on:
      - caddy

  # Lokálny LLM — Ollama. Hostí malé modely (rozhodnutie #104): Qwen3-0.6B ako
  # router/vyhodnocovač, multilingual-e5-small na embeddingy, nemotron-mini 4B ako
  # eskalácia. Žiadny veľký model, žiadne platené API. Appka MUSÍ fungovať aj keď
  # tento kontajner nebeží — všetky utility úlohy majú deterministický fallback.
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  mariadb:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_DATABASE: auraai
      MARIADB_USER: auraai
      MARIADB_PASSWORD: auraai
      MARIADB_ROOT_PASSWORD: auraai_root
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  dbdata:
  redisdata:
  ollamadata:
  nodemodules:
