name: hades

x-app: &app
  build: docker/php
  restart: always
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - "${CC_TRANSCRIPTS:-C:/Users/Ucet/.claude/projects}:/transcripts:ro"
    - "C:/Users/Ucet/.claude/projects/C--Users-Ucet-Desktop-AI-mind/memory:/memory-rw"
  depends_on:
    - mariadb
    - redis

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PHP_CLI_SERVER_WORKERS: 8
    command: php artisan serve --host=0.0.0.0 --port=8080

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    ports:
      - "127.0.0.1:8081:8081"
    command: php artisan reverb:start --host=0.0.0.0 --port=8081

  # Reverzný proxy pre verejný (ngrok) prístup — appka + WebSocket na jednom porte,
  # chránené basic-auth. Lokálny 127.0.0.1:8080 ostáva priamy (bez hesla, bez proxy).
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "127.0.0.1:8095:8095"
    # Tajomstvá pre Caddyfile — predtým boli natvrdo v ňom (git-trackovaný).
    # `:?` je zámerné: bez hodnoty stack odmietne nabehnúť, namiesto toho aby
    # tunel bežal s prázdnym tokenom/heslom.
    #
    # HADES_MCP_TOKEN je TEN ISTÝ, ktorý číta Laravel (config/hades.php), takže
    # verejná query cesta a Bearer overenie v appke nemôžu rozbehnúť.
    #
    # POZOR na bcrypt hash: compose interpoluje hodnoty z .env, takže surové
    # `$2y$12$e4ZV…` sa rozpadne na neexistujúce premenné a Caddy dostane
    # zrezané `$2y$12` — každé heslo potom vráti 401 a vyzerá to ako zlé heslo.
    # Preto musí byť hodnota v .env v JEDNODUCHÝCH úvodzovkách (tie prežijú
    # aj compose, aj phpdotenv). Detail je v docs/BEZPECNOST.md, sekcia 8.
    environment:
      HADES_MCP_TOKEN: "${HADES_MCP_TOKEN:?HADES_MCP_TOKEN chýba v .env}"
      CADDY_BASIC_AUTH_HASH: "${CADDY_BASIC_AUTH_HASH:?CADDY_BASIC_AUTH_HASH chýba v .env (bcrypt hash v jednoduchých úvodzovkách)}"
      # UI token — Caddy ho na verejnej ceste vkladá do hlavičky za basic-auth,
      # takže dashboard netreba odomykať dvakrát. Rovnaká hodnota, akú overuje
      # Laravel (config/hades.php → AuthenticateUi): JEDEN zdroj v .env.
      HADES_UI_TOKEN: "${HADES_UI_TOKEN:?HADES_UI_TOKEN chýba v .env (token UI okruhu)}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - reverb

  mariadb:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_DATABASE: hades
      MARIADB_USER: hades
      MARIADB_PASSWORD: hades
      MARIADB_ROOT_PASSWORD: hades_root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  # ---------------------------------------------------------------------------
  # Lokálny model pre konzolu vedomia (/console) a pre embeddingy.
  #
  # CPU-ONLY, a to nie z lenivosti: stroj má AMD Radeon iGPU, ktorú Docker na
  # Windows do kontejnera nepustí (žiadny ROCm device, žiadny --gpus). Preto tu
  # nie je `deploy.resources.devices` — keby tam bol, len by to klamalo o tom,
  # čo sa deje.
  #
  # Dôsledky, ktoré určujú nastavenia nižšie:
  #  - Docker VM má ~24,6 GB (WSL2 default = polovica hosta). MoE model s 30B
  #    parametrami v Q4 zaberá ~18,6 GB, takže sa doňho vojde JEDEN model naraz
  #    (`OLLAMA_MAX_LOADED_MODELS=1`). Druhý načítaný model by VM vytlačil do
  #    swapu a appka by prestala odpovedať.
  #  - Načítanie 18 GB z disku trvá desiatky sekúnd, preto `OLLAMA_KEEP_ALIVE`
  #    drží model teplý pol hodiny. Bez toho platí každá druhá otázka rozbeh.
  #  - `OLLAMA_NUM_PARALLEL=1`: paralelné behy si delia to isté CPU a v súčte sú
  #    pomalšie než za sebou, ale KV cache si znásobia.
  # ---------------------------------------------------------------------------
  #  - Na stroji UŽ JEDEN Ollama server beží (`auraai-ollama-1` z nedokončeného
  #    AuraAI refactoru, port 11434) a má v sebe stiahnuté modely. Hades preto
  #    default mieri naň (`OLLAMA_HOST=http://host.docker.internal:11434`) a TÁTO
  #    služba je profilová — spustí sa len `docker compose --profile ollama up -d`,
  #    keď má mať Hades vlastnú inštanciu. Dva servery naraz by zdvojili ~10 GB
  #    modelov a bili by sa o tú istú RAM vo VM, ktorá má dohromady 24,6 GB.
  ollama:
    image: ollama/ollama:latest
    restart: always
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      # necháva jadrá appke a DB; všetkých 24 na inferenciu appku vyhladuje
      OLLAMA_NUM_THREADS: 20
    ports:
      # 11435, nie 11434 — ten drží existujúci server a kolízia by službu nepustila
      - "127.0.0.1:11435:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  dbdata:
  redisdata:
  ollamadata:
