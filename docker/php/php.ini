; ---------------------------------------------------------------------------
; PHP pre DEV kontejner Hadesa. Jediná vec, ktorú tento súbor rieši, je
; opcache — a to nie „pre výkon", ale preto, že bez neho appka mala zmerané
; sekundové špičky pri obyčajnom klikaní.
;
; ČO SA MERALO (31. 8. 2026, `php artisan serve` + PHP_CLI_SERVER_WORKERS=8,
; repo ako bind-mount z Windows hostu, 3,2 ms na jeden stat() proti 0,005 ms
; na natívnom FS kontejnera):
;
;   séria 6 dopytov s medzerou 3,2 s (= človek kliká, nie burst test)
;   ─────────────────────────────────────────────────────────────────────
;   opcache VYPNUTÉ (stav pred)                 1,29–6,80 s, 6/6 nad 1 s
;   opcache ON, validate_timestamps=1, freq=2   1,29–6,95 s, 6/6 nad 1 s
;   ... to isté + realpath_cache 8M/600         1,29–1,93 s, 6/6 nad 1 s
;   opcache ON, validate_timestamps=0           0,13–0,42 s, 0/6 nad 1 s
;
; Z toho vyplývajú tri veci, ktoré sa dajú ľahko pokaziť opačným smerom:
;
; 1. Cena NIE JE kompilácia, ale REVALIDÁCIA. Zapnutie opcache samotné
;    nezlepšilo nič (druhý riadok tabuľky) — 542 includovaných súborov ×
;    stat() cez mount je celá špička. Preto tu nie je `memory_consumption`
;    ako hlavná páka; hlavná páka je `validate_timestamps`.
; 2. `revalidate_freq` špičku nezruší, len zriedi. Pri freq=2 ju spustí každá
;    medzera > 2 s, teda presne to bežné klikanie. Vyššia hodnota (30, 60) by
;    ju posunula do „raz za minútu", čo je ale horšie než reštart: staršie
;    hodnoty by sa vracali NEPREDVÍDATEĽNE.
; 3. `realpath_cache_size` / `realpath_cache_ttl` sú tu ZÁMERNE na defaulte.
;    Zmerané ako inertné (tretí riadok tabuľky proti druhému), a zdvihnutie
;    TTL má vlastnú cenu: `file_exists()` číta realpath cache, takže po
;    `optimize:clear` by Laravel ešte minúty veril, že `bootstrap/cache/*.php`
;    existuje. Nulový prínos za reálnu pascu — nezdvíhaj ich.
;
; CENA, KTORÚ TO PLATÍ: zmena v .php sa NEPREJAVÍ, kým sa proces nereštartuje:
;
;     docker compose restart -t 1 app     ; zmerané 1,0–2,1 s
;
; `-t 1` tam nie je kozmetika: `php artisan serve` neodpovedá na SIGTERM, takže
; bez neho compose čaká celý default 10 s a potom pošle SIGKILL — zmerané
; 11,1 s a 11,0 s proti 1,0 s a 2,1 s s `-t 1`. Príkaz sa vracia skôr, než
; server prijme prvé spojenie; prvý dopyt po reštarte teda ešte môže dostať
; connection refused (zmerané: 0,000215 s) a druhý platí studený boot (3,5 s).
;
; PLATÍ TO AJ NA BLADE, a to je najmenej očividná časť. `.blade.php` sa
; kompiluje do `storage/framework/views/<hash>.php`, kde hash je z CESTY
; šablóny, nie z obsahu — nový obsah teda príde na TÚ ISTÚ cestu a opcache
; bez validácie podá starý opcode. Editácia `mind.blade.php` / `chat.blade.php`
; sa preto tiež prejaví až po reštarte.
;
; Tá staleness je zmeraná, nie predpokladaná, a kalibrovaná z oboch strán:
; `php -S` nad `/tmp/oc/index.php` vracal `V1` ešte 3,5 s po tom, čo súbor na
; disku obsahoval `V2` (`cat` to potvrdil), kým nový proces nad tým istým
; súborom vypísal `V2`. Bez tej druhej strany by sa nedalo odlíšiť „opcache
; drží starý kód" od „zápis sa nestal".
;
; Je to ten istý model, s ktorým appka už žije u troch zo štyroch PHP služieb —
; `queue:work`, `schedule:work` a `reverb:start` sú dlho bežiace procesy a kód
; si držia v pamäti tiež. JS a CSS sa opcache NETÝKA (`public/js`, `public/css`
; servuje server priamo), takže frontend vývoj sa nemení vôbec.
;
; ČO TÁTO ZMENA NEZAPLATILA: zostáva zriedkavá špička ~2,1–2,6 s, zmeraná
; v 1 z 30 dopytov (a 3 zo 60 v inej sérii). Nie je to stat storm ani accept
; queue — `time_connect` je 0,00015 s a celé zdržanie je v `time_starttransfer`,
; teda vnútri PHP. Overené a VYLÚČENÉ ako príčina: `session.driver=file` na
; mounte (A/B 24+24 dopytov proti druhému serveru s `SESSION_DRIVER=redis`
; vnútri toho istého kontejnera — jediná špička padla na REDIS stranu).
; Zvyšok je kontencia hosta / mount daemona, mimo dosahu tohto súboru.
;
; Keď niekto POTREBUJE validáciu (napr. dlhé ladenie v PHP s reloadom na každé
; uloženie), netreba prestavovať image — stačí prebiť ini pre jeden beh:
;
;     docker compose run --rm --service-ports app \
;       php -d opcache.validate_timestamps=1 artisan serve --host=0.0.0.0 --port=8080
;
; TOTO JE DEV KONFIGURÁCIA. Do produkcie by rovnaké `validate_timestamps=0`
; patrilo tiež, ale tam za deploy nasleduje reštart procesu tak či tak.
; ---------------------------------------------------------------------------

[opcache]
; `php artisan serve` je CLI SAPI, takže bez `enable_cli` je opcache mŕtva
; bez ohľadu na `enable` — presne to bol stav pred touto zmenou
; (`opcache_get_status()` vracalo false, hoci rozšírenie bolo načítané).
opcache.enable=1
opcache.enable_cli=1

; 128 MB je nad reálnou potrebou (542 súborov na dopyt, celý korpus príkazov
; a testov je rádovo nižšie než 20000). SHM alokuje master `artisan serve`
; a zdedí ho všetkých 8 forknutých workerov, takže sa nenásobí.
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Jadro celej zmeny. Viď tabuľku vyššie a cenu pod ňou.
opcache.validate_timestamps=0

; JIT zámerne vypnutý: tento profil je bootstrap frameworku a I/O, nie
; číselná smyčka — JIT by pridal warm-up a nemal by čo zrýchliť.
opcache.jit=disable
opcache.jit_buffer_size=0
