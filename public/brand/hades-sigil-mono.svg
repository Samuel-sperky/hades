<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hades">
  <title>Hades</title>
  <style>
    /* monochróm: jedna farba, dedí sa cez currentColor (tlač, razítko, jednofarebné
       podklady). Jadro tu nesie plnú výplň — hierarchia zostáva, aj keď farba zmizne. */
    svg { --acc: currentColor; --gold: currentColor; }
    path, circle, line { stroke: var(--acc); stroke-linecap: round; fill: none; }
    .gold-stroke { stroke: var(--gold); }
    .gold-fill { fill: var(--gold); stroke: none; }
    .ticks line { opacity: .5; } .ticks .hair { opacity: .3; }
    .edge { opacity: .75; }
  </style>
  <!-- A (46): hranica vedomia, prerušená 26° tam, kde vstupuje uzol -->
  <path d="M 91.69 30.56 A 46 46 0 1 1 78.95 14.25" fill="none" stroke-width="1.5"/>
  <!-- stupnica: 60 delení po 6°, každé piate dlhšie; mlčí v prerušení -->
