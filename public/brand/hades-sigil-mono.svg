<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hades">
  <title>Hades</title>
  <!-- GENEROVANÉ public/brand/build-mark.py z hades-sigil-mini.svg — needituj ručne. -->
  <style>
    /* monochróm: jedna farba, dedí sa cez currentColor (tlač, razítko, jednofarebné
       podklady). Jadro tu nesie plnú výplň — hierarchia zostáva, aj keď farba zmizne. */
    svg { --acc: currentColor; --gold: currentColor; }
    path, circle, line { stroke: var(--acc); stroke-linecap: round; fill: none; }
    .gold-stroke { stroke: var(--gold); }
    .gold-fill { fill: var(--gold); stroke: none; }
    .ticks line { opacity: .45; }
    .edge { opacity: .75; }
  </style>
  <!-- vlásková hranica vedomia (r 47): neprerušená, len rám deja -->
  <circle cx="50" cy="50" r="47" stroke-width="1" opacity=".55"/>
  <!-- 12 delení po 30°, mlčia v prerušení -->
  <g class="ticks">
    <line x1="50" y1="7" x2="50" y2="3" stroke-width="1"/>
    <line x1="71.5" y1="12.76" x2="73.5" y2="9.3" stroke-width="1"/>
    <line x1="93" y1="50" x2="97" y2="50" stroke-width="1"/>
    <line x1="87.24" y1="71.5" x2="90.7" y2="73.5" stroke-width="1"/>
    <line x1="71.5" y1="87.24" x2="73.5" y2="90.7" stroke-width="1"/>
    <line x1="50" y1="93" x2="50" y2="97" stroke-width="1"/>
    <line x1="28.5" y1="87.24" x2="26.5" y2="90.7" stroke-width="1"/>
    <line x1="12.76" y1="71.5" x2="9.3" y2="73.5" stroke-width="1"/>
    <line x1="7" y1="50" x2="3" y2="50" stroke-width="1"/>
    <line x1="12.76" y1="28.5" x2="9.3" y2="26.5" stroke-width="1"/>
    <line x1="28.5" y1="12.76" x2="26.5" y2="9.3" stroke-width="1"/>
  </g>
  <!-- NOSNÝ PRSTENEC (r 36, hrúbka 9) — TOTOŽNÝ s mini
       kánonom. Prerušený 34° tam, kde vstupuje uzol. Pod 64 px sa
       prerušenie zatvára a kreslí sa mini: ten istý prstenec, to isté jadro. -->
  <path d="M 83.61 37.1 A 36 36 0 1 1 70.65 20.51" stroke-width="9"/>
  <!-- hrana: uzol viazaný na jadro -->
  <line x1="73.64" y1="31.53" x2="64.18" y2="38.92" stroke-width="1.6" class="edge"/>
  <!-- satelit: jeden uzol, prstenec (nie disk), v prerušení NA prstenci -->
  <circle cx="78.37" cy="27.84" r="5.5" stroke-width="2.5"/>
  <!-- jadro: obežnica + jediný sýty PLNÝ prvok znaku. r 15 = mini kánon. -->
  <circle cx="50" cy="50" r="22" stroke-width="1" class="gold-stroke"/>
  <circle cx="50" cy="50" r="15" class="gold-fill"/>
</svg>
