  <!-- jadro: obežnica + jediný sýty PLNÝ prvok znaku -->
  <circle cx="50" cy="50" r="15" fill="none" class="gold-stroke" stroke-width="1"/>
  <circle cx="50" cy="50" r="8.5" class="gold-fill"/>
