<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 187" role="img" aria-label="Hades">
  <title>Hades</title>
  <style>
    /* Wordmark je ATRAMENTOVÝ, farbu nesie znak. Zlatá zostáva jadru. */
    svg { --acc: #6d3fb5; --gold: #b88a3a; --ink: #101d1b; }
    @media (prefers-color-scheme: dark) { svg { --acc: #c4a2f5; --gold: #d8b878; --ink: #eaf3f1; } }
  </style>
  <g class="sig" transform="translate(106.00 0.00) scale(1.00000)">
  <!-- GENEROVANÉ tools/brand/build-mark.py — needituj ručne. Geometria siete je
       prepočet SIGIL_NET z public/js/shared/sigil.js (viewBox 24) na tento box;
       farby a stupeň redukcie sú z hades-sigil-mini.svg. -->
  <style>.sig{ --acc: #6d3fb5; --gold: #b88a3a; }@media (prefers-color-scheme: dark) {.sig{ --acc: #c4a2f5; --gold: #d8b878; }}.sig circle, .sig line{ stroke: var(--acc); stroke-linecap: round; fill: none; }.sig .edges line{ opacity: .8; }.sig .edges .lat{ opacity: .5; }.sig .gold-fill{ fill: var(--gold); stroke: none; }</style>
  <!-- HRANY sa kreslia PRVÉ, aby uzly stáli na nich, nie naopak. Tri idú zo
       STREDU jadra (tam sú skryté pod jeho plným kotúčom), štvrtá je chorda
       medzi dvoma satelitmi a jadro OBCHÁDZA — bez nej je to hviezda, nie sieť.
       Bočná hrana (.lat) je slabšia: jadro musí zostať tým, na čo sa sieť viaže. -->
  <g class="edges">
    <line x1="50" y1="50" x2="26.12" y2="37.25" stroke-width="4.58"/>
    <line x1="50" y1="50" x2="73.92" y2="40.21" stroke-width="4.58"/>
    <line x1="50" y1="50" x2="55.96" y2="74.71" stroke-width="4.58"/>
    <line x1="78.75" y1="45.5" x2="63.21" y2="75.58" stroke-width="4.58" class="lat"/>
  </g>
  <!-- SATELITY: prstence bez výplne (priehľadnosť nesie diera, nie alfa).
       Rovnako veľké, v nepravidelných uhloch. Pod 32 px zmiznú spolu s hranami. -->
  <circle cx="16.92" cy="32.33" r="7.92" stroke-width="5"/>
  <circle cx="83.54" cy="36.25" r="7.92" stroke-width="5"/>
  <circle cx="58.42" cy="84.83" r="7.92" stroke-width="5"/>
  <!-- JADRO: jediný sýty PLNÝ prvok celého znaku a je ZLATÝ. Amethystový prstenec
       okolo neho tu do 2. 9. 2026 bol a je RETIROVANÝ (rozhodnutie: vyhráva appka):
       štvrtý prstenec by z jadra urobil štvrtý uzol a „jediný sýty" by prestalo platiť. -->
  <circle cx="50" cy="50" r="10.83" class="gold-fill"/>
  </g>
